<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Meme Collector{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">梗</span>
      <div>
        <h1>热梗采集控制台</h1>
        <p>采集、审核并安全写入 Dify 知识库</p>
      </div>
    </div>
    {% if current_username %}
    <nav class="main-nav" aria-label="主导航">
      <a href="/">首页</a>
      <a href="/tasks">任务</a>
      <a href="/pending">待审核</a>
      <a href="/runs">运行记录</a>
      <a href="/settings">配置</a>
    </nav>
    <form class="logout-form" method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <span>{{ current_username }}</span>
      <button class="button ghost" type="submit">退出</button>
    </form>
    {% endif %}
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
