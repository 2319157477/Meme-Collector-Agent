[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "meme-collector-agent"
version = "0.1.0"
description = "Single-host meme collection service with pending review and Dify writes"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "apscheduler>=3.10",
  "openai-agents>=0.1.0",
  "PyJWT>=2.8"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.scripts]
meme-collector-agent = "meme_collector_app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["meme_collector_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
